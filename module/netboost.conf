# NetBoost configuration
# ----------------------
# Choose the default scenario applied on every boot.
#
#   train  - high-speed rail / metro: BBRv3 (fast recovery on handover)
#   crowd  - concerts / dense crowds: CUBIC (fairness under overload)
#   weak   - weak signal (bathroom etc.): westwood (wireless random loss)
#   wifi   - home Wi-Fi: BBRv3 + fq (low bufferbloat latency)
#
# You can change this file anytime and reboot, or switch live via:
#   echo "scenario=<name>" > /proc/netboost
SCENARIO=wifi
