# NetBoost configuration
# ----------------------
# ZERO-CONFIG: you normally never need to touch this file.
#
# The default scenario "boost" applies on every boot and covers all common
# CN mobile-network situations (metro / high-speed rail / dense crowds /
# weak signal / home Wi-Fi / game login). All tuning (BBRv3 + fq, MTU
# probing, keepalive, 16MB buffers) is applied automatically.
#
# Optional per-situation overrides (advanced users only, applied on boot):
#
#   boost  - all-round default (recommended, zero-config)
#   train  - high-speed rail / metro: BBRv3 (fast recovery on handover)
#   crowd  - concerts / dense crowds: CUBIC (fairness under overload)
#   weak   - weak signal (bathroom etc.): westwood (wireless random loss;
#            provided by the bundled tcp_westwood.ko - NOT in the stock kernel)
#   wifi   - home Wi-Fi: BBRv3 + fq (low bufferbloat latency)
#   game   - same algo as boost; kept for compatibility (its tuning is now
#            part of the common zero-config block)
#
# Live switch without editing this file (takes effect for NEW connections):
#   su -c "echo 'scenario=game' > /proc/netboost"
SCENARIO=boost
