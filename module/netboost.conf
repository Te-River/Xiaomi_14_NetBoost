# NetBoost configuration
# ----------------------
# ZERO-CONFIG: you normally never need to touch this file.
#
# The scenario set here is applied on every boot. Default "boost" covers
# all common CN mobile-network situations (metro / high-speed rail /
# dense crowds / weak signal / home Wi-Fi / game login).
#
# Scenarios (algo preference + qdisc + keepalive preset):
#   boost  - all-round default (BBRv3 + fq + 60s NAT keepalive)
#   train  - high-speed rail / metro (BBRv3, fast recovery on handover)
#   crowd  - concerts / dense crowds (CUBIC + fq_codel, fairness)
#   weak   - weak signal (westwood + fq_codel, tolerates random loss)
#   wifi   - home Wi-Fi (BBRv3 + fq + STOCK keepalive - 60s probes are
#            pointless behind a home NAT and only wake the radio)
#   game   - like boost (kept as an alias)
#
# Live switch at runtime (no reboot, affects NEW connections):
#   su -c "/data/adb/modules/netboost/nb.sh wifi"
#
# Temporarily restore ALL stock network sysctls (A/B testing):
#   su -c "/data/adb/modules/netboost/nb.sh stock"
#
# A reboot re-applies the scenario configured below.
SCENARIO=boost
