name: Build NetBoost kernel modules

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  # Keep in sync with DDK_TAG in scripts/build.sh.
  DDK_TAG: '20260313'

jobs:
  build:
    runs-on: ubuntu-latest
    # Required for the Release step to create releases via the default
    # GITHUB_TOKEN (without this it fails with 403 "Resource not
    # accessible by integration").
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        kmi: [ android14-6.1 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull DDK image
        run: |
          docker pull "ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${DDK_TAG}"

      # The in-container script auto-detects the kernel tree at
      # /opt/ddk/kdir/<kmi> and the clang toolchain under /opt/ddk/clang,
      # then builds both modules with the GKI clang toolchain (LLVM=1).
      - name: Build kernel modules
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            "ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${DDK_TAG}" \
            bash scripts/build-in-ddk.sh "${{ matrix.kmi }}"

      - name: Package KernelSU module
        run: |
          mkdir -p out
          ( cd module && zip -r ../out/netboost-${{ matrix.kmi }}.zip . )
          ( cd kernel/tcp_bbr3 && zip -j ../../out/netboost-${{ matrix.kmi }}.zip tcp_bbr3.ko )
          ( cd kernel/tcp_bbr && zip -j ../../out/netboost-${{ matrix.kmi }}.zip tcp_bbr.ko )
          ( cd kernel/tcp_westwood && zip -j ../../out/netboost-${{ matrix.kmi }}.zip tcp_westwood.ko )
          # update.json ships as a release asset so module.prop's updateJson
          # can point at releases/latest/download/update.json (always the
          # newest metadata, no CDN cache lag like jsDelivr @main).
          cp update.json out/
          ls -la out/

      - name: Syntax-check WebUI JS (ES module mode)
        run: |
          # v2.7.5 regression guard: plain `node --check` treats the file as
          # a classic script where duplicate function declarations are legal;
          # the WebView loads it as type="module" (strict mode) where they
          # are a fatal SyntaxError that blanks the entire WebUI.
          python3 -c "
          import re
          h = open('module/webroot/index.html').read()
          s = re.search(r'<script[^>]*>(.*)</script>', h, re.S).group(1)
          open('/tmp/webui.mjs','w').write(s)
          "
          node --input-type=module --check < /tmp/webui.mjs
          echo "WebUI module JS OK"

      - name: Verify module zip
        run: |
          unzip -l out/netboost-${{ matrix.kmi }}.zip
          for f in module.prop customize.sh service.sh netboost.conf uninstall.sh \
                   nb.sh update-display.sh lingxi.sh webroot/index.html webroot/kernelsu.js \
                   BUILD_RELEASE tcp_bbr3.ko tcp_bbr.ko tcp_westwood.ko; do
            unzip -l out/netboost-${{ matrix.kmi }}.zip | grep -q " ${f}\$" || {
              echo "ERROR: ${f} missing from module zip"; exit 1; }
          done
          # MODVERSIONS fact (kernel/module/version.c: same_magic()): for
          # modules with __crc_* sections, insmod compares only the FLAGS
          # part of vermagic ("SMP preempt mod_unload modversions aarch64");
          # the release string is NOT compared (CRC-backed instead). So we
          # assert flags + a 6.1 release prefix, making one build load on
          # ALL 6.1.x-android14 kernels (6.1.138 and any later sublevel).
          GKI_FLAGS="SMP preempt mod_unload modversions aarch64"
          for ko in kernel/*/*.ko; do
            vm="$(strings "$ko" | grep '^vermagic=' | head -1)"
            case "$vm" in
              "vermagic=6.1."*" ${GKI_FLAGS}") ;;
              *) echo "ERROR: vermagic flags mismatch in ${ko}: ${vm:-<none>}"; exit 1 ;;
            esac
          done
          echo "all modules release-agnostic: flags = GKI android14-6.1, CRC-backed"
          echo "module zip OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netboost-${{ matrix.kmi }}
          path: out/netboost-${{ matrix.kmi }}.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/netboost-*.zip
            out/update.json
          generate_release_notes: true
          body: |
            **NetBoost ${{ github.ref_name }}** — 小米 14（SM8650 / android14-6.1 GKI）内核级网络加速模块

            ### 安装
            1. 下载下方 `netboost-android14-6.1.zip`
            2. KernelSU Manager 中安装并重启
            3. 零配置，装完即生效（BBRv3 + fq + MTU 探测 + NAT 保活 + 16MB 缓冲）
            4. 灵犀式自动场景引擎开机自启：RSRP 弱信号预判 / 小区学习 / 出电梯快速回网 / 场景自动择优

            ### 验证
            ```bash
            su -c "cat /proc/sys/net/ipv4/tcp_congestion_control"   # 应显示 bbr3
            su -c "/data/adb/modules/netboost/nb.sh status"         # 完整状态
            su -c "/data/adb/modules/netboost/lingxi.sh status"     # 灵犀自动场景状态
            ```
            或在 KernelSU 管理器中打开本模块的 WebUI 查看实时状态。

            ### 兼容性
            MODVERSIONS 机制下 vermagic 仅校验 flags（符号 CRC 兜底 ABI），
            本构建兼容所有 `6.1.x-android14` 内核（6.1.138 及各 sublevel）。

            ### 故障排查
            日志位于 `/data/adb/modules/netboost/netboost.log`

            ---

            ### 变更记录
