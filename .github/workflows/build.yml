name: Build NetBoost kernel modules

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  # Keep in sync with DDK_TAG in scripts/build.sh.
  DDK_TAG: '20260313'

jobs:
  build:
    runs-on: ubuntu-latest
    # Required for the Release step to create releases via the default
    # GITHUB_TOKEN (without this it fails with 403 "Resource not
    # accessible by integration").
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        kmi: [ android14-6.1 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull DDK image
        run: |
          docker pull "ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${DDK_TAG}"

      # The in-container script auto-detects the kernel tree at
      # /opt/ddk/kdir/<kmi> and the clang toolchain under /opt/ddk/clang,
      # then builds both modules with the GKI clang toolchain (LLVM=1).
      - name: Build kernel modules
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            "ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${DDK_TAG}" \
            bash scripts/build-in-ddk.sh "${{ matrix.kmi }}"

      - name: Package KernelSU module
        run: |
          mkdir -p out
          ( cd module && zip -r ../out/netboost-${{ matrix.kmi }}.zip . )
          ( cd kernel/netboost_core && zip -j ../../out/netboost-${{ matrix.kmi }}.zip netboost_core.ko )
          ( cd kernel/tcp_bbr3 && zip -j ../../out/netboost-${{ matrix.kmi }}.zip tcp_bbr3.ko )
          ( cd kernel/tcp_bbr && zip -j ../../out/netboost-${{ matrix.kmi }}.zip tcp_bbr.ko )
          ( cd kernel/tcp_westwood && zip -j ../../out/netboost-${{ matrix.kmi }}.zip tcp_westwood.ko )
          ls -la out/

      - name: Verify module zip
        run: |
          unzip -l out/netboost-${{ matrix.kmi }}.zip
          for f in module.prop customize.sh service.sh netboost.conf uninstall.sh \
                   nb.sh update-display.sh BUILD_RELEASE \
                   netboost_core.ko tcp_bbr3.ko tcp_bbr.ko tcp_westwood.ko; do
            unzip -l out/netboost-${{ matrix.kmi }}.zip | grep -q " ${f}\$" || {
              echo "ERROR: ${f} missing from module zip"; exit 1; }
          done
          # If a target device release is pinned, assert every .ko vermagic
          # equals it (a mismatch means insmod will fail on the device).
          if [ -s kernel/TARGET_RELEASE ]; then
            REL="$(tr -d '[:space:]' < kernel/TARGET_RELEASE)"
            for ko in kernel/*/*.ko; do
              strings "$ko" | grep -q "vermagic=${REL} " || {
                echo "ERROR: vermagic of ${ko} != ${REL}"; exit 1; }
            done
            echo "all modules pinned to ${REL}"
          else
            echo "NOTE: kernel/TARGET_RELEASE empty - modules carry the ddk"
            echo "tree release (vermagic will not match any device)."
          fi
          echo "module zip OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netboost-${{ matrix.kmi }}
          path: out/netboost-${{ matrix.kmi }}.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/netboost-*.zip
          generate_release_notes: true
          body: |
            **NetBoost ${{ github.ref_name }}** — 小米 14（SM8650 / android14-6.1 GKI）内核级网络加速模块

            ### 安装
            1. 下载下方 `netboost-android14-6.1.zip`
            2. KernelSU Manager 中安装并重启
            3. 零配置，装完即生效（BBRv3 + fq + MTU 探测 + NAT 保活 + 16MB 缓冲）

            ### 验证
            ```bash
            su -c "cat /proc/netboost"
            su -c "cat /proc/sys/net/ipv4/tcp_congestion_control"   # 应显示 bbr3
            ```

            ### 故障排查
            日志位于 `/data/adb/modules/netboost/netboost.log`

            ---

            ### 变更记录
